# Edits a document, starts a new one, and checks both reach the mock server.
# Run after e2e/sign-in-ios.yaml (or -android) against dev/mock-server.mjs.
appId: com.zvn.markie.mobile
---
- tapOn: ".*Launch brief.*"
- extendedWaitUntil:
    visible: "Edit"
    timeout: 8000
- tapOn: "Edit"
# Markdown opens in the rich view; Source shows the text itself.
- tapOn: "Source"
- tapOn: "Text of Launch brief"
- inputText: " Edited on the phone"
- tapOn: "Save"
- extendedWaitUntil:
    visible: ".*Edited on the phone.*"
    timeout: 8000
- tapOn: "Back to Recent"
- tapOn: "New document"
# The desktop's chooser: every format it offers.
- tapOn: "New Markdown document"
- tapOn: "Untitled"
- inputText: "Grocery list"
- tapOn: "Next"
- tapOn: "Source"
- tapOn: "Text of Grocery list"
- inputText: "- Milk"
- tapOn: "Create"
- extendedWaitUntil:
    visible: ".*Milk.*"
    timeout: 8000
