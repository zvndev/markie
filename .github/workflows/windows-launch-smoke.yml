name: Windows launch smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-launch-smoke.yml"
      - "build/**"
      - "electron/**"
      - "mcp/**"
      - "out/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/windows-launch-smoke.yml"
      - "build/**"
      - "electron/**"
      - "mcp/**"
      - "out/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"

jobs:
  launch-smoke:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows unpacked package
        run: npm run electron:pack:win

      - name: Verify Windows package structure
        run: npm run electron:smoke:win

      - name: Launch Windows package
        run: npm run electron:smoke:win:launch
        env:
          # A throwaway runner, not a developer's Mac: consent is implied.
          MARKIE_ALLOW_E2E: "1"

      - name: Upload launch smoke evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-launch-smoke
          path: |
            .autoloop/runs/windows-launch-smoke-*/launch-smoke.json
            .autoloop/runs/windows-launch-smoke-*/screenshot.png
          if-no-files-found: ignore
