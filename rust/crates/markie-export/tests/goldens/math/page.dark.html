<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>{KATEX_CSS}

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* The page margin box cannot be painted by the document. With
     a 2cm page margin the dark theme filled only the text area and
     every page came out as a dark rectangle floating in a white frame, which
     is what a dark export actually looked like. Chromium propagates neither
     the body background nor the html background into that margin box, and a
     fixed-position backdrop is clipped to the page area, so all three of the
     obvious fixes do nothing. Measured, not guessed.

     So the page has no margin at all and the inset is padding on the body,
     which the background does cover. box-decoration-break: clone is what
     makes that padding repeat on the second page and every page after it;
     without it padding applies once at the top of the first fragment and once
     at the bottom of the last, and page two starts with text against the paper
     edge. Chromium honours it here. See scripts/pdf-export-check.mjs, which
     prints a two-page document and reads the corner pixels back. */
  @page {
    size: A4;
    margin: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.75;
    padding: 2cm 2.2cm;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* A line stranded alone at a page boundary reads as a mistake in the export
     rather than as prose. */
  .markdown-body p, .markdown-body li { orphans: 2; widows: 2; }

  .markdown-body { max-width: 100%; }

  /* Nothing may be wider than the column. Chromium scales the whole document
     down to the widest box when printing, so one long URL or one wide table
     used to turn every page into tiny text. Long words and links break
     anywhere rather than run off the page. */
  .markdown-body { overflow-wrap: anywhere; }

  /* Export HTML is read in a browser as often as it is printed, and a body
     the width of a monitor is a body nobody finishes a line of. Screen only:
     paper already has its measure from the page size. */
  @media screen {
    body { max-width: 46em; margin: 0 auto; }
  }

  .markdown-body h1 {
    font-size: 2em;
    font-weight: 700;
    margin: 1.2em 0 0.5em;
    padding-bottom: 0.3em;
    letter-spacing: -0.025em;
    page-break-after: avoid;
  }

  .markdown-body h1:first-child { margin-top: 0; }

  .markdown-body h2 {
    font-size: 1.5em;
    font-weight: 650;
    margin: 1.3em 0 0.45em;
    padding-bottom: 0.25em;
    letter-spacing: -0.02em;
    page-break-after: avoid;
  }

  .markdown-body h3 {
    font-size: 1.25em;
    font-weight: 600;
    margin: 1.2em 0 0.4em;
    page-break-after: avoid;
  }

  .markdown-body h4 {
    font-size: 1.1em;
    font-weight: 600;
    margin: 1.1em 0 0.35em;
    page-break-after: avoid;
  }

  .markdown-body h5, .markdown-body h6 {
    font-size: 1em;
    font-weight: 600;
    margin: 1em 0 0.3em;
    page-break-after: avoid;
  }

  .markdown-body p { margin: 0.7em 0; }

  .markdown-body a { text-decoration: none; }

  .markdown-body strong { font-weight: 650; }
  .markdown-body em { font-style: italic; }

  .markdown-body blockquote {
    margin: 1em 0;
    padding: 0.5em 1em;
    border-left: 3px solid;
    border-radius: 0 6px 6px 0;
  }

  .markdown-body blockquote p { margin: 0.25em 0; }

  .markdown-body ul, .markdown-body ol {
    margin: 0.6em 0;
    padding-left: 1.8em;
  }

  .markdown-body li { margin: 0.25em 0; }
  .markdown-body ul li { list-style-type: disc; }
  .markdown-body ol li { list-style-type: decimal; }

  .markdown-body code {
    font-family: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
    font-size: 0.88em;
    padding: 0.15em 0.35em;
    border-radius: 4px;
    border: 1px solid;
  }

  /* A scroll container does not scroll on paper: overflow-x: auto used to
     clip a long line silently at the block's right edge. It wraps instead. */
  .markdown-body pre {
    margin: 1em 0;
    padding: 1em 1.2em;
    border-radius: 8px;
    border: 1px solid;
    white-space: pre-wrap;
    overflow: visible;
    page-break-inside: avoid;
  }

  .markdown-body pre code {
    padding: 0;
    background: none !important;
    border: none;
    border-radius: 0;
    font-size: 0.85em;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .markdown-body hr {
    margin: 1.8em 0;
    border: none;
    height: 1px;
  }

  .markdown-body img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    margin: 1em 0;
    page-break-inside: avoid;
  }

  /* A video card (rehype-embeds.ts) is its thumbnail, linked. The one YouTube
     serves is 4:3 with black bars, so it is cropped to the player's shape. */
  .markdown-body p.markie-embed img {
    display: block;
    width: 100%;
    max-width: 640px;
    aspect-ratio: 16 / 9;
    object-fit: cover;
  }

  .markdown-body table {
    width: auto;
    max-width: 100%;
    margin: 1em 0;
    border-collapse: collapse;
    font-size: 0.9em;
  }

  /* A long table breaks between rows, never inside one, and the header
     repeats on every page it spans. */
  .markdown-body thead { display: table-header-group; }
  .markdown-body tr { page-break-inside: avoid; }
  .markdown-body th, .markdown-body td { overflow-wrap: anywhere; }

  .markdown-body thead th {
    text-align: left;
    padding: 0.55em 0.8em;
    font-weight: 600;
    font-size: 0.85em;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .markdown-body tbody td {
    padding: 0.5em 0.8em;
  }

  .markdown-body input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border: 2px solid;
    border-radius: 3px;
    vertical-align: middle;
    margin-right: 5px;
    position: relative;
    top: -1px;
  }

  .markdown-body input[type="checkbox"]:checked::after {
    content: "✓";
    font-size: 10px;
    font-weight: 700;
    position: absolute;
    top: -1px;
    left: 1px;
  }

  .markdown-body .task-list-item {
    list-style: none;
    margin-left: -1.5em;
  }

  .markdown-body del { text-decoration: line-through; }
  .markdown-body sup { font-size: 0.75em; vertical-align: super; }
  .markdown-body sub { font-size: 0.75em; vertical-align: sub; }


  body { background: #09090b; color: #fafafa; }
  .markdown-body { color: #fafafa; }
  .markdown-body h1 { border-bottom: 1px solid #27272a; }
  .markdown-body h2 { border-bottom: 1px solid #27272a; }
  .markdown-body h5, .markdown-body h6 { color: #a1a1aa; }
  .markdown-body a { color: #60a5fa; }
  .markdown-body strong { color: #fff; }
  .markdown-body blockquote { border-left-color: #c084fc; background: #18181b; color: #a1a1aa; }
  .markdown-body li::marker { color: #a1a1aa; }
  .markdown-body code { background: #18181b; border-color: #27272a; color: #fb923c; }
  .markdown-body pre { background: #18181b; border-color: #27272a; }
  .markdown-body pre code { color: #fafafa; }
  .markdown-body hr { background: #27272a; }
  .markdown-body thead th { background: #18181b; border-bottom: 2px solid #27272a; color: #a1a1aa; }
  .markdown-body tbody td { border-bottom: 1px solid #27272a; }
  .markdown-body del { color: #a1a1aa; }
  .markdown-body input[type="checkbox"] { border-color: #3f3f46; }
  .markdown-body input[type="checkbox"]:checked { background: #60a5fa; border-color: #60a5fa; }
  .markdown-body input[type="checkbox"]:checked::after { color: #000; }

  /* highlight.js dark */
  .hljs { color: #c9d1d9; }
  .hljs-keyword { color: #ff7b72; }
  .hljs-string { color: #a5d6ff; }
  .hljs-title { color: #d2a8ff; }
  .hljs-built_in { color: #ffa657; }
  .hljs-comment { color: #8b949e; }
  .hljs-number { color: #79c0ff; }
  .hljs-attr { color: #79c0ff; }
  .hljs-subst { color: #c9d1d9; }
  .hljs-literal { color: #79c0ff; }
  .hljs-type { color: #ffa657; }
  .hljs-params { color: #c9d1d9; }
  .hljs-variable { color: #ffa657; }
  .hljs-function { color: #d2a8ff; }


  .markdown-body .katex { font-size: 1.05em; }
  .markdown-body .katex-display { margin: 1em 0; page-break-inside: avoid; }
  .markdown-body .katex-display > .katex { white-space: normal; }
  .markdown-body .katex-error { color: #ef4444; font-family: inherit; }
</style>
<script>
(function () {
  function fit() {
    var article = document.querySelector("article.markdown-body");
    if (!article) return;
    var max = article.clientWidth;
    var body = getComputedStyle(document.body);
    var pageHeight = 1122.5 - parseFloat(body.paddingTop) - parseFloat(body.paddingBottom);
    var blocks = article.querySelectorAll("table, pre, .katex-display, img, p.markie-embed");
    for (var i = 0; i < blocks.length; i += 1) {
      var el = blocks[i];
      var width = el.scrollWidth;
      if (width > max + 1) el.style.zoom = String(Math.max(0.4, max / width));
      if (el.getBoundingClientRect().height > pageHeight * 0.5) el.style.breakInside = "auto";
    }
  }
  function whenReady(run) {
    var loaded = document.readyState === "complete"
      ? Promise.resolve()
      : new Promise(function (resolve) { window.addEventListener("load", resolve, { once: true }); });
    var fonts = (document.fonts && document.fonts.ready) || Promise.resolve();
    Promise.all([loaded, Promise.resolve(fonts)]).then(run, run);
  }
  whenReady(fit);
})();
</script>
</head>
<body>
<article class="markdown-body">{BODY}</article>
</body>
</html>
