[workspace]
resolver = "2"
members = [
  "crates/markie-core",
  "crates/markie-app",
  "crates/markie-cloud",
  "crates/markie-rich",
  "crates/markie-math",
  "crates/markie-editor",
  "crates/markie-office",
  "crates/markie-office-view",
  "crates/markie-vault",
  "crates/markie-migrate",
  "crates/markie-agent",
  "crates/markie-export",
  "crates/markie-web",
  "crates/markie-update",
  "crates/markie-google",
]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
markie-core = { path = "crates/markie-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rusqlite = { version = "0.43", features = ["bundled"] }
dirs = "7"
tempfile = "3"

[profile.dev]
# GPUI is slow unoptimized; keep our code debuggable and deps fast.
opt-level = 0
# Line tables keep file:line in backtraces and the watchdog's samples, without
# full variable info. Every agent builds in its own worktree, and full debug info
# made one debug build 80 GB.
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 2
# No debug info for dependencies (GPUI and the rest): we never step into them.
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
