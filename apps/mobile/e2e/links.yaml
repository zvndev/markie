# Deep links while signed in: a document on someone else's account (403), one
# that doesn't exist (404), and a public share. The first two offer the way
# back, not a retry. The signed-out half (a public share opens to read, a
# private document waits for sign-in) is at the end of e2e/settings.yaml,
# which is the flow that signs out.
# Run with: maestro --device <id> test -e OUT=<dir> -e NAME=ios-light e2e/links.yaml
appId: com.zvn.markie.mobile
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: ".*Launch brief.*"
    timeout: 15000
- openLink: "markie-mobile://d/someone-elses-doc"
# iOS asks before it hands a custom-scheme link to the app.
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "You don't have access"
    timeout: 10000
- assertVisible: "Back to Recent"
- assertNotVisible: "Try again"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/${NAME}-9-link-403
- tapOn:
    text: "Back to Recent"
    index: 1
- waitForAnimationToEnd
- openLink: "markie-mobile://d/no-such-doc"
# iOS asks before it hands a custom-scheme link to the app.
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Document not found"
    timeout: 10000
- assertNotVisible: "Try again"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/${NAME}-10-link-404
- tapOn:
    text: "Back to Recent"
    index: 1
- waitForAnimationToEnd
# A public share, signed in: the reading screen, with the account's own actions.
- openLink: "markie-mobile://s/pub_launch_brief_demo_token"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Public link"
    timeout: 10000
- assertNotVisible: "Sign in to edit, comment or share."
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/${NAME}-11-link-public
