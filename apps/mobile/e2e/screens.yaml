# Walks Recent and both documents against dev/mock-server.mjs, signed in, and
# screenshots each one. settings.yaml takes Settings and Sign in. Run with: maestro --device <id> test -e OUT=<dir> -e NAME=ios-light e2e/screens.yaml
appId: com.zvn.markie.mobile
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: ".*Launch brief.*"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/${NAME}-2-recent
- tapOn: ".*Launch brief.*"
- extendedWaitUntil:
    visible: "Status"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/${NAME}-3-markdown
- swipe:
    direction: UP
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/${NAME}-4-markdown-more
- swipe:
    direction: UP
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/${NAME}-4-markdown-end
- tapOn: "Back to Recent"
- waitForAnimationToEnd
- tapOn: ".*Counter.*"
- extendedWaitUntil:
    visible: "Trust this document"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/${NAME}-5-darkmown-untrusted
- tapOn: "Trust this document"
- extendedWaitUntil:
    visible: "Revoke"
    timeout: 10000
- tapOn: "Add one"
- tapOn: "Add one"
- tapOn: "Add one"
- takeScreenshot: ${OUT}/${NAME}-6-darkmown-trusted
