[package]
name = "markie-app"
description = "Markie RS: the native Rust desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "markie-rs"
path = "src/main.rs"

[dependencies]
rusqlite.workspace = true
markie-core.workspace = true
markie-agent = { path = "../markie-agent" }
markie-cloud = { path = "../markie-cloud" }
markie-update = { path = "../markie-update" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
markie-office = { path = "../markie-office" }
markie-office-view = { path = "../markie-office-view" }
markie-editor = { path = "../markie-editor" }
markie-rich = { path = "../markie-rich" }
yrs = "=0.28.2"
markie-vault = { path = "../markie-vault" }
markie-google = { path = "../markie-google" }
markie-migrate = { path = "../markie-migrate" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
getrandom = "0.3"
regex = "1"
zeroize = "1"
dirs.workspace = true
markie-export = { path = "../markie-export" }
markie-web = { path = "../markie-web", features = ["wry"] }
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
pulldown-cmark.workspace = true
trash = "5"
futures = "0.3"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui-kit = { version = "=0.10.0", features = [
  "tree-sitter-markdown",
  "tree-sitter-markdown-inline",
  "tree-sitter-yaml",
  "tree-sitter-html",
  "tree-sitter-rust",
  "tree-sitter-javascript",
  "tree-sitter-typescript",
  "tree-sitter-python",
  "tree-sitter-bash",
  "tree-sitter-css",
  "tree-sitter-toml",
  # Every grammar GPUI Kit ships, for fenced code in Source
  # (`@codemirror/language-data` in Electron).
  "tree-sitter-languages",
] }

# Scene mode for background screen comparisons (docs/rust-port/SCREEN.md):
# `cargo build --release --features scene`. Never part of a shipped build.
# It turns on GPUI's test-support for `Window::render_to_image`.
gpui-scene = { package = "gpui-pre", version = "=0.3.12", optional = true, default-features = false, features = ["test-support"] }

[features]
# The Mac app on the super-nightly channel: identity in markie-core, updater
# and first-run import on. Built by scripts/nightly-release.sh, never by default.
nightly = ["markie-core/nightly"]
# The public Mac app (docs/rust-port/PUBLIC.md). Built by
# scripts/public-release.sh, never by default, never with `nightly`.
public = ["markie-core/public"]
scene = ["dep:gpui-scene", "dep:gpui-scene-macos"]

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSResponder", "NSView", "NSWindow", "NSPrintInfo", "NSPrintOperation", "NSAlert", "NSButton", "NSControl", "NSCell", "NSEvent", "block2"] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSString", "NSProcessInfo"] }
block2 = "0.6"
objc2-pdf-kit = { version = "0.3.2", features = ["PDFDocument", "objc2-app-kit"] }
raw-window-handle = "0.6"
# The macOS half of `render_to_image`, for the `scene` feature only.
gpui-scene-macos = { package = "gpui-pre-macos", version = "=0.3.12", optional = true, default-features = false, features = ["test-support"] }
