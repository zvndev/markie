# Screenshots Settings, signs out, screenshots Sign in, then opens two links
# while signed out: a private document (it waits for sign-in) and a public
# share (it opens to read, with no account). A fresh launch,
# because after a document screen is popped, Android's WebView can hand Maestro
# a stale accessibility tree until the next touch.
# Run with: maestro --device <id> test -e OUT=<dir> -e NAME=ios-light e2e/settings.yaml
appId: com.zvn.markie.mobile
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: ".*Launch brief.*"
    timeout: 15000
- tapOn: "Settings"
# Android reads a row as one string ("Your server10.0.2.2:8790").
- extendedWaitUntil:
    visible: "Your server.*"
    timeout: 10000
# Follow the device's appearance, which screenshots.sh sets per pass.
- tapOn: "System"
# Notifications show only where the build can receive them: always on iOS,
# and on Android only when it was built with a Firebase project.
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "Comments and replies"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/${NAME}-7-settings
# Notifications and "On this phone" put Sign out below the fold.
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/${NAME}-7-settings-end
- tapOn: "Sign out"
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Sign in to Markie"
    timeout: 10000
- takeScreenshot: ${OUT}/${NAME}-1-sign-in
- openLink: "markie-mobile://d/agent-brief"
# iOS asks before it hands a custom-scheme link to the app.
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/${NAME}-8-link-before-sign-in
# A public share needs no account: it opens to read, and offers sign-in.
- openLink: "markie-mobile://s/pub_launch_brief_demo_token"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Sign in to edit, comment or share."
    timeout: 10000
- assertVisible: "Public link"
- assertNotVisible: "Edit"
- assertNotVisible: "Comments"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/${NAME}-12-public-link-signed-out
# Sign in from the reader: the share waits, and the way back to it is offered.
# The back button reads "Back to Sign in", so the bar's button is the only exact match.
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Sign in to Markie"
    timeout: 10000
- assertVisible: "Read it without signing in"
