[package]
name = "markie-app"
description = "Markie RS: the native Rust desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "markie-rs"
path = "src/main.rs"

[dependencies]
markie-core.workspace = true
markie-cloud = { path = "../markie-cloud" }
tokio = { version = "1", features = ["rt-multi-thread"] }
markie-office = { path = "../markie-office" }
markie-office-view = { path = "../markie-office-view" }
markie-editor = { path = "../markie-editor" }
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
pulldown-cmark.workspace = true
trash = "5"
futures = "0.3"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui-kit = { version = "=0.10.0", features = [
  "tree-sitter-markdown",
  "tree-sitter-markdown-inline",
  "tree-sitter-yaml",
  "tree-sitter-html",
  "tree-sitter-rust",
  "tree-sitter-javascript",
  "tree-sitter-typescript",
  "tree-sitter-python",
  "tree-sitter-bash",
  "tree-sitter-css",
  "tree-sitter-toml",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSResponder", "NSView", "NSWindow"] }
raw-window-handle = "0.6"
