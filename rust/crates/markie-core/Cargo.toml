[package]
name = "markie-core"
description = "Markie RS core: formats, device document index, search, saving. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The Mac app on the super-nightly channel: Markie's own name, bundle id and
# markie:// scheme, with a data folder of its own. Without it, the dev side
# build "Markie RS". src/paths.rs, docs/rust-port/NIGHTLY.md.
nightly = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
rusqlite.workspace = true
dirs.workspace = true
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
trash = "5"
regex = "1"
memchr = "2"
url = "2"
miniz_oxide = "0.8"
serde_yaml = "0.9"

[target.'cfg(unix)'.dependencies]
xattr = "1"

[dev-dependencies]
tempfile.workspace = true
