[package]
name = "markie-app"
description = "Markie RS: the native Rust desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "markie-rs"
path = "src/main.rs"

[dependencies]
markie-core.workspace = true
anyhow.workspace = true
gpui-kit = { version = "=0.10.0", features = [
  "tree-sitter-markdown",
  "tree-sitter-markdown-inline",
  "tree-sitter-yaml",
  "tree-sitter-html",
  "tree-sitter-rust",
  "tree-sitter-javascript",
  "tree-sitter-typescript",
  "tree-sitter-python",
  "tree-sitter-bash",
  "tree-sitter-css",
  "tree-sitter-toml",
] }
