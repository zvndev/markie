[package]
name = "markie-editor"
description = "Markie RS rich (View mode) editor: the GPUI view over markie-rich's editor model."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
markie-rich = { path = "../markie-rich" }
markie-math = { path = "../markie-math" }
gpui-kit = "=0.10.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
yrs = "=0.28.2"
serde_json.workspace = true

[dev-dependencies]
markie-cloud = { path = "../markie-cloud" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
