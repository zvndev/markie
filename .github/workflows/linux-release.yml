name: Linux release

# Builds the Linux packages (AppImage and .deb, x64) on a real Linux runner,
# launches each of them under a virtual display, installs and removes the deb,
# and writes the build evidence that release:prepare:linux checks. With
# publish_release it then uploads the packages to the rolling linux-built tag,
# where the release machine fetches them from.
#
# Nothing here is code-signed, by design: Linux has no Gatekeeper or
# SmartScreen to satisfy, and the updater verifies the SHA-512 in
# latest-linux.yml before installing anything. What stands in for a signature
# is the evidence file: the exact commit, this run, the checks below, and the
# SHA-512 of every package, beside a SHA512SUMS file users can check by hand.
#
# Publishing defaults off and only ever happens from main, so dispatching this
# to try a build cannot replace what a release is about to fetch.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Upload the packages, feed, checksums and evidence to the linux-built release tag (main only)
        type: boolean
        default: false
  # The changes most likely to break a Linux package. Not a required check, so
  # a path filter is fine here; the release dispatch is the gate.
  pull_request:
    paths:
      - electron-builder.config.cjs
      - package.json
      - package-lock.json
      - electron/main.js
      - electron/linux-desktop.js
      - electron/update-policy.js
      - scripts/desktop-launch-smoke.mjs
      - scripts/package-smoke.mjs
      - scripts/linux-build-evidence.mjs
      - .github/workflows/linux-release.yml

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  linux-release:
    name: Build, launch and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Refuse to publish from anywhere but main
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref != 'refs/heads/main'
        run: |
          echo "::error::publish_release uploads to the tag the release machine fetches from; dispatch it on main (got ${GITHUB_REF})"
          exit 1

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.13.1"
          cache: npm

      # What a desktop has and a runner may not: a display server, the
      # libraries Electron loads, and the desktop entry validator.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgbm1 libnss3 libasound2t64 libgtk-3-0t64 libxss1 libsecret-1-0 \
            libnotify4 libxtst6 desktop-file-utils fuse3

      - name: Install dependencies
        run: npm ci

      - name: Build the renderer
        run: npm run build

      - name: Resolve the version being built
        run: |
          version=$(node -p 'require("./package.json").version')
          test -n "$version"
          echo "MARKIE_VERSION=$version" >> "$GITHUB_ENV"
          echo "building Markie $version at $GITHUB_SHA"

      # npmRebuild stays on here, unlike Windows: the runner has a compiler,
      # and node-pty ships no Linux prebuild, so @electron/rebuild compiling
      # both native modules against Electron's headers is the only way to get
      # them.
      - name: Build AppImage and deb
        run: npx electron-builder --config electron-builder.config.cjs --linux --x64 --publish never

      - name: List what was built
        run: ls -la dist && cat dist/latest-linux.yml

      - name: Verify the unpacked package structure
        run: npm run electron:smoke:linux

      # Chromium's sandbox needs unprivileged user namespaces, which Ubuntu
      # 24.04 restricts through AppArmor. The unpacked smoke runs with them
      # allowed, the configuration of most distributions; the AppImage and deb
      # legs below run with Ubuntu's restriction back on, which is what a user
      # on Ubuntu has and what each package has its own answer for.
      - name: Launch the unpacked app
        env:
          MARKIE_ALLOW_E2E: "1"
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          xvfb-run -a --server-args="-screen 0 1440x900x24" npm run electron:smoke:linux:launch

      - name: Check the AppImage's desktop entry and updater config
        run: |
          set -euo pipefail
          appimage="$PWD/dist/Markie-${MARKIE_VERSION}-x86_64.AppImage"
          chmod +x "$appimage"
          work=$(mktemp -d)
          (cd "$work" && "$appimage" --appimage-extract 'markie.desktop' >/dev/null && "$appimage" --appimage-extract 'resources/app-update.yml' >/dev/null && "$appimage" --appimage-extract 'resources/icons/markie.png' >/dev/null)
          cat "$work/squashfs-root/markie.desktop"
          desktop-file-validate "$work/squashfs-root/markie.desktop"
          grep -q '^MimeType=.*text/markdown;' "$work/squashfs-root/markie.desktop"
          grep -q '^MimeType=.*x-scheme-handler/markie;' "$work/squashfs-root/markie.desktop"
          grep -q '^StartupWMClass=markie$' "$work/squashfs-root/markie.desktop"
          grep -q "^X-AppImage-Version=${MARKIE_VERSION}$" "$work/squashfs-root/markie.desktop"
          cat "$work/squashfs-root/resources/app-update.yml"
          grep -q '^path: linux$' "$work/squashfs-root/resources/app-update.yml"
          test -s "$work/squashfs-root/resources/icons/markie.png"

      # The AppImage as a user runs it: through the AppImage runtime and AppRun,
      # which adds --no-sandbox itself when user namespaces are restricted.
      - name: Launch the AppImage
        env:
          MARKIE_ALLOW_E2E: "1"
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1 || true
          xvfb-run -a --server-args="-screen 0 1440x900x24" \
            node scripts/desktop-launch-smoke.mjs --platform linux --arch x64 \
              --executable "$PWD/dist/Markie-${MARKIE_VERSION}-x86_64.AppImage"

      # The deb as a user installs it, then launched from where it installed,
      # with Ubuntu's namespace restriction on: its postinst installs the
      # AppArmor profile that lets the sandbox start anyway.
      - name: Install, launch and remove the deb
        env:
          MARKIE_ALLOW_E2E: "1"
        run: |
          set -euo pipefail
          sudo apt-get install -y "$PWD/dist/Markie-${MARKIE_VERSION}-amd64.deb"
          dpkg -s markie | sed -n '1,12p'
          cat /usr/share/applications/markie.desktop
          desktop-file-validate /usr/share/applications/markie.desktop
          grep -q '^MimeType=.*text/markdown;' /usr/share/applications/markie.desktop
          grep -q '^MimeType=.*x-scheme-handler/markie;' /usr/share/applications/markie.desktop
          grep -q '^Categories=Office;TextEditor;Utility;$' /usr/share/applications/markie.desktop
          test "$(cat /opt/Markie/resources/package-type)" = "deb"
          grep -q '^path: linux$' /opt/Markie/resources/app-update.yml
          test -x /usr/bin/markie
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1 || true
          xvfb-run -a --server-args="-screen 0 1440x900x24" \
            node scripts/desktop-launch-smoke.mjs --platform linux --arch x64 --executable /opt/Markie/markie
          sudo apt-get remove -y markie
          test ! -e /opt/Markie/markie

      - name: Write checksums and build evidence
        run: |
          node scripts/linux-build-evidence.mjs \
            --dist dist \
            --version "$MARKIE_VERSION" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --check package-smoke \
            --check xvfb-launch-smoke-unpacked \
            --check xvfb-launch-smoke-appimage \
            --check deb-install-launch-remove \
            --check desktop-entry-valid \
            --check updater-config
          cat "dist/Markie-${MARKIE_VERSION}-linux-SHA512SUMS.txt"
          (cd dist && sha512sum -c "Markie-${MARKIE_VERSION}-linux-SHA512SUMS.txt")

      - name: Upload the packages as a build artifact
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: markie-linux-${{ env.MARKIE_VERSION }}-${{ github.sha }}
          path: |
            dist/Markie-*-x86_64.AppImage
            dist/Markie-*-amd64.deb
            dist/latest-linux.yml
            dist/Markie-*-linux-build.json
            dist/Markie-*-linux-SHA512SUMS.txt
            .autoloop/runs/desktop-launch-smoke-*/
          if-no-files-found: warn
          retention-days: 14

      # A release asset rather than only an Actions artifact, for the reason the
      # Windows workflow gives: the artifact quota can fill silently, a release
      # upload fails loudly. Named files only, so nothing else rides along.
      - name: Publish to the linux-built release tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view linux-built --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create linux-built \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Linux (built)" \
              --notes "Rolling Linux packages, replaced on every published Linux build. Unsigned by design; each build carries its commit, checks and SHA-512 in Markie-<version>-linux-build.json."
          fi
          gh release upload linux-built \
            "dist/Markie-${MARKIE_VERSION}-x86_64.AppImage" \
            "dist/Markie-${MARKIE_VERSION}-amd64.deb" \
            dist/latest-linux.yml \
            "dist/Markie-${MARKIE_VERSION}-linux-build.json" \
            "dist/Markie-${MARKIE_VERSION}-linux-SHA512SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "published Markie ${MARKIE_VERSION} (${GITHUB_SHA}) to the linux-built tag"
