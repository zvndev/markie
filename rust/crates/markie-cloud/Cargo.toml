[package]
name = "markie-cloud"
description = "Markie RS cloud client: servers, sign-in, sync, sharing, comments and live text rooms. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
url = "2.5"
unicode-normalization = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
yrs = { version = "0.28", features = ["sync"] }
keyring = "4"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
percent-encoding = "2"
base64 = "0.22"
regex = "1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
tempfile.workspace = true
