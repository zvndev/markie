[package]
name = "markie-office"
description = "Markie RS Office engine: original DOCX, RTF, ODT, DOC and HTML-import codecs written from the public specifications. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Browser-equivalent primitives already used by Markie RS. No Office parser
# is supplied by these: archive framing and document limits are ours.
miniz_oxide = "0.8"
encoding_rs = "0.8"
unicode-segmentation = "1.13"
url = "2"
html5ever = "0.27"
markup5ever_rcdom = "0.3"

[dev-dependencies]
miniz_oxide = "0.8"
