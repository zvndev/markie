[package]
name = "markie-office"
description = "Markie RS Office engine: original DOCX, RTF, ODT, DOC and HTML-import codecs written from the public specifications. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Raw DEFLATE only. This is the generic platform primitive the decision record
# allows (the TypeScript uses the browser's DecompressionStream). It is not a
# ZIP, XML or Office engine: archive framing and every limit are our own code.
miniz_oxide = "0.8"

[dev-dependencies]
miniz_oxide = "0.8"
