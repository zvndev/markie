version: 2

# One grouped PR per ecosystem and directory each week for minor and patch
# updates, so a small team reviews four PRs instead of forty. Majors are left
# out of the groups and arrive one PR each, because each can break something on
# its own (Electron, KaTeX and better-auth all have). Groups apply to version
# updates only: security updates are still raised as soon as an advisory lands,
# one PR per advisory, regardless of the schedule below.
updates:
  # The signing workflow pins actions to commit SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # Desktop app and renderer.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      root-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # typescript-eslint (8.72.1, and canary 8.72.2-alpha.11) needs the
      # TypeScript compiler API and caps its peer range at typescript <6.1.0.
      # TypeScript 7 is the native compiler and its npm package exports no
      # compiler API (require("typescript") returns only the version), so
      # `npm run lint` cannot load it. Lift this once a typescript-eslint
      # release lists typescript 7 in its peerDependencies.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Node type definitions must match the Node the code runs on: Node 22
      # (engines, CI node-version, the server's node:22-alpine image). Newer
      # majors would type-check calls to APIs Node 22 does not have. Bump the
      # @types/node major by hand when the runtime moves.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # Markie Cloud server.
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      server-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # Markie Docs phone app.
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
    groups:
      mobile-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # Same rule as the root: Node types follow the Node 22 runtime the
      # tooling runs on. Bump the major by hand when the runtime moves.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
