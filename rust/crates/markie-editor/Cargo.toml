[package]
name = "markie-editor"
description = "Markie RS rich (View mode) editor: the GPUI view over markie-rich's editor model."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
markie-rich = { path = "../markie-rich" }
markie-math = { path = "../markie-math" }
gpui-kit = "=0.10.0"
markie-core.workspace = true
markie-export = { path = "../markie-export" }
markie-web = { path = "../markie-web", features = ["wry"] }
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
yrs = "=0.28.2"
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSSpellChecker"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSRange", "NSArray"] }

[dev-dependencies]
tempfile.workspace = true
markie-cloud = { path = "../markie-cloud" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
