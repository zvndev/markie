[package]
name = "markie-core"
description = "Markie RS core: formats, device document index, search, saving. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The private "Markie Nightly" variant: its own name, bundle id, data folder,
# URL scheme and Keychain service, so it runs beside the dev "Markie RS" build
# and Electron Markie. docs/rust-port/NIGHTLY.md.
nightly = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
rusqlite.workspace = true
dirs.workspace = true
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
trash = "5"
regex = "1"
memchr = "2"
url = "2"
miniz_oxide = "0.8"
serde_yaml = "0.9"

[target.'cfg(unix)'.dependencies]
xattr = "1"

[dev-dependencies]
tempfile.workspace = true
